<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 ETF 리밸런싱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── TOP NAV ────────────────────────────────────────── -->
  <nav class="topnav">
    <div class="nav-left">
      <span class="nav-logo">📊 ETF 리밸런싱</span>
      <div id="global-stats" class="global-stats"></div>
    </div>
    <div class="nav-right">
      <span id="refresh-status" class="refresh-tag"></span>
      <button id="btn-refresh" class="btn btn-primary btn-sm">🔄 시세 새로고침</button>
      <button id="btn-bulk-price" class="btn btn-ghost btn-sm">✏️ 가격 직접 입력</button>
      <button id="btn-add-account" class="btn btn-secondary btn-sm">+ 계좌 추가</button>
      <button id="btn-export" class="btn btn-ghost btn-sm">📋 CSV</button>
      <a href="/logout" class="btn btn-ghost btn-sm" style="text-decoration:none">🔒 로그아웃</a>
    </div>
  </nav>

  <!-- ── HOW-TO STEPPER ─────────────────────────────────── -->
  <section class="stepper-bar">
    <div class="stepper-label">📅 매달 리밸런싱 순서</div>
    <div class="steps">
      <div class="step" data-step="1">
        <div class="step-num">1</div>
        <div class="step-text">잔액 입력</div>
        <div class="step-sub">현금 잔액 확인</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" data-step="2">
        <div class="step-num">2</div>
        <div class="step-text">시세 조회</div>
        <div class="step-sub">🔄 새로고침 클릭</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" data-step="3">
        <div class="step-num">3</div>
        <div class="step-text">주문 확인</div>
        <div class="step-sub">매수·매도 수량</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" data-step="4">
        <div class="step-num">4</div>
        <div class="step-text">주문 실행</div>
        <div class="step-sub">증권사 앱에서</div>
      </div>
      <div class="step-arrow">→</div>
      <div class="step" data-step="5">
        <div class="step-num">5</div>
        <div class="step-text">수량 업데이트</div>
        <div class="step-sub">종목 클릭→편집</div>
      </div>
    </div>
  </section>

  <!-- ── MAIN ───────────────────────────────────────────── -->
  <main id="accounts-container"></main>

  <!-- ══════════════ MODALS ══════════════ -->

  <!-- Account Modal -->
  <div id="modal-account" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-account-title">계좌 추가</h2>
        <button class="modal-close" id="btn-cancel-account">✕</button>
      </div>
      <div class="form-group">
        <label>계좌명</label>
        <input id="modal-account-name" type="text" placeholder="예: IRP, 퇴직연금, 연금저축" />
      </div>
      <div class="form-group">
        <label>월 추가 납입액 <span class="label-hint">(매달 입금하는 금액)</span></label>
        <input id="modal-account-invest" type="number" placeholder="250000" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancel-account2">취소</button>
        <button class="btn btn-primary" id="btn-save-account">저장</button>
      </div>
    </div>
  </div>

  <!-- Holding Modal -->
  <div id="modal-holding" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-holding-title">종목 추가</h2>
        <button class="modal-close" id="btn-close-holding">✕</button>
      </div>

      <div class="form-group">
        <label>종목 코드 <span class="label-hint">(네이버 금융 6자리)</span></label>
        <div class="input-row">
          <input id="modal-holding-code" type="text" placeholder="예: 381180" maxlength="6" />
          <button class="btn btn-secondary btn-sm" id="btn-lookup-code">검색</button>
        </div>
        <div id="lookup-result" class="lookup-result"></div>
      </div>

      <div class="form-group">
        <label>표시 이름</label>
        <input id="modal-holding-name" type="text" placeholder="예: TIGER 반도체" />
      </div>

      <div class="form-group">
        <label>리스크 분류</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="risk" value="위험" /> <span class="risk-chip risk-danger">위험</span></label>
          <label class="radio-label"><input type="radio" name="risk" value="안전" checked /> <span class="risk-chip risk-safe">안전</span></label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>보유 수량 <span class="label-hint">(주)</span></label>
          <input id="modal-holding-qty" type="number" placeholder="0" min="0" />
        </div>
        <div class="form-group">
          <label>평균 매수가 <span class="label-hint">(원)</span></label>
          <input id="modal-holding-avgprice" type="number" placeholder="0" min="0" />
        </div>
      </div>

      <div class="form-group">
        <label>목표 비율 <span class="label-hint">(%)</span></label>
        <div class="target-input-wrap">
          <input id="modal-holding-target" type="number" placeholder="20" min="0" max="100" step="1" />
          <span class="target-preview" id="target-preview">%</span>
        </div>
      </div>

      <div class="form-group collapsible-group">
        <div class="collapse-toggle" onclick="this.parentElement.classList.toggle('open')">
          ▶ 현재가 직접 입력 <span class="label-hint">(자동 조회 실패 시)</span>
        </div>
        <div class="collapse-body">
          <input id="modal-holding-manualprice" type="number" placeholder="현재가 (원), 비워두면 자동 조회" min="0" />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-danger-ghost" id="btn-delete-holding" style="display:none">🗑 삭제</button>
        <button class="btn btn-ghost" id="btn-cancel-holding">취소</button>
        <button class="btn btn-primary" id="btn-save-holding">저장</button>
      </div>
    </div>
  </div>

  <!-- Bulk Price Modal -->
  <div id="modal-bulk-price" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box" style="max-width:480px">
      <div class="modal-header">
        <h2>✏️ 현재가 직접 입력</h2>
        <button class="modal-close" id="btn-cancel-bulk">✕</button>
      </div>
      <div class="tip-box">
        💡 시세 자동 조회가 안 될 때 사용하세요.<br>
        네이버 금융에서 현재가를 직접 확인 후 입력하세요.
      </div>
      <div id="bulk-price-fields"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancel-bulk2">취소</button>
        <button class="btn btn-primary" id="btn-save-bulk">✓ 적용</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
